name: evals

on:
  pull_request:
    branches: [main]
    paths:
      - 'SKILL.md'
      - 'AGENTS.md'
      - 'references/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  push:
    branches: [main]
    paths:
      - 'SKILL.md'
      - 'AGENTS.md'
      - 'references/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch: {}

# 防止同分支并发跑爆 API 配额
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 把 secret 存在性转成 env，避免 if 里直接判 secrets（GitHub 限制）
      HAS_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install skill-up
        run: |
          curl -fsSL https://raw.githubusercontent.com/alibaba/skill-up/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Show tool versions
        run: |
          skill-up --version
          claude --version || echo "claude not found"

      - name: Validate eval.yaml
        run: skill-up validate evals/eval.yaml

      - name: List cases
        run: skill-up list-cases evals/eval.yaml

      - name: Run evals
        if: env.HAS_TOKEN == 'true'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: skill-up run evals/eval.yaml
        continue-on-error: true  # evals 有 case FAIL 会 exit 1，但不阻塞 artifact 上传

      - name: Move workspace into cwd (for artifact upload)
        if: always() && env.HAS_TOKEN == 'true'
        run: |
          # skill-up 把 workspace 放在 ../<skill-name>-workspace/
          if [ -d ../fe-argus-workspace ]; then
            mv ../fe-argus-workspace ./fe-argus-workspace
            echo "Moved workspace into cwd"
          else
            echo "No workspace found at ../fe-argus-workspace"
            ls -la ..
          fi

      - name: Capture eval summary
        if: always() && env.HAS_TOKEN == 'true'
        continue-on-error: true
        run: |
          # bash 的 `[ -f glob ]` 不展开，用 ls 找文件
          result_file=$(ls fe-argus-workspace/iteration-*/result.json 2>/dev/null | head -1)
          if [ -z "$result_file" ]; then
            echo 'No result.json found'
            ls -la fe-argus-workspace/ 2>/dev/null || echo 'no workspace dir'
            exit 0
          fi
          # heredoc 必须顶格（不能在 if 块里缩进），否则 PYEOF 闭合识别失败
          python3 - "$result_file" <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print('== Eval Summary ==')
          for c in d.get('case_results', []):
              mark = '✓' if c['status']=='PASS' else ('⚠' if c['status']=='ERROR' else '✗')
              print(f"  {mark} {c['case_id']:<32} {c['status']}")
          summary = d.get('case_results', [])
          passed = sum(1 for c in summary if c['status']=='PASS')
          print(f'\nTotal: {passed}/{len(summary)} PASS')
          PYEOF

      - name: Upload eval report
        if: always() && env.HAS_TOKEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: fe-argus-workspace/iteration-*/
          if-no-files-found: warn
          retention-days: 14

      - name: Skip evals (no token)
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice::Eval run skipped — ANTHROPIC_AUTH_TOKEN secret not set."
          echo "To enable: repo Settings → Secrets and variables → Actions → add ANTHROPIC_AUTH_TOKEN"
          echo "(Optional) add ANTHROPIC_BASE_URL and ANTHROPIC_MODEL if using a proxy."
